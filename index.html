<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Animation Store</title>

    <!-- Store UI -->
    <link rel="stylesheet" href="css/store.css">

    <!-- Modal UI -->
    <link rel="stylesheet" href="css/modal.css">

    <!-- Individual animations -->
    <link rel="stylesheet" href="css/blob.css">
    <link rel="stylesheet" href="css/spinner.css">
    <link rel="stylesheet" href="css/pulse.css">
    <link rel="stylesheet" href="css/orbit.css">
    <link rel="stylesheet" href="css/dna.css">
</head>

<body>

    <main class="app-store">

        <header class="header">
            <h1>Animation Store</h1>
            <p>Explore interactive visual simulations</p>
        </header>

        <section
            class="app-list"
            id="appList"
            aria-label="Animation library">
        </section>

    </main>

    <div
        class="modal"
        id="animationModal"
        aria-hidden="true">

        <div class="player-card">

            <button
                class="close-btn"
                id="closeModalBtn"
                type="button"
                aria-label="Close animation">
                ✕
            </button>

            <div
                class="player-title"
                id="modalTitle">
                Animation
            </div>

            <div
                class="player-subtitle"
                id="modalSubtitle">
                Simulation
            </div>

            <div
                class="animation-stage"
                id="stageContainer">
            </div>

            <button
                class="play-btn playing"
                id="stopModalBtn"
                type="button">
                Stop & Exit
            </button>

        </div>

    </div>

    <!-- Audio engine (must come first) -->
    <script src="audio/audio-engine.js"></script>

    <!-- Registry (must load before animation modules) -->
    <script src="js/registry.js"></script>

    <!-- Animation sounds -->
    <script src="audio/blob.js"></script>
    <script src="audio/spinner.js"></script>
    <script src="audio/pulse.js"></script>
    <script src="audio/orbit.js"></script>
    <script src="audio/dna.js"></script>

    <!-- Animation modules -->
    <script src="animations/blob.js"></script>
    <script src="animations/spinner.js"></script>
    <script src="animations/pulse.js"></script>
    <script src="animations/orbit.js"></script>
    <script src="animations/dna.js"></script>

    <!-- UI -->
    <script src="js/buttons.js"></script>
    <script src="js/app.js"></script>

</body>
</html>
